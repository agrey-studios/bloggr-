    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsMediaOrganization",
        "name": "Bloggr",
        "url": "https://bloggr.media/",
        "logo": "https://bloggr.media/favicon.svg",
        "sameAs": [
          "https://twitter.com/bloggrmedia"
        ],
        "description": "Modern news, blogging, short-video and creator publishing platform.",
        "publishingPrinciples": "https://bloggr.media/#policy-editorial",
        "correctionsPolicy": "https://bloggr.media/#policy-editorial"
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
      (function() {
        var theme = localStorage.getItem('bloggr_theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
